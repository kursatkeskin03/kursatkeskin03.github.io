<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logaritma Denemeleri Çözümleri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
/* Düzen: tek sütun okuma kartı; üstte kâğıt/soru seçici, altta komşu sorulara geçiş */
:root {
  --paper: #F6F8FC;
  --card: #FFFFFF;
  --ink: #1E2433;
  --muted: #69738A;
  --navy: #14213D;
  --royal: #2D4DA8;
  --amber: #E39A0F;
  --sand: #FDF1D8;
  --mist: #E9EEF8;
  --line: #DCE3F0;
  --on-navy: #FFFFFF;
  --serif: "Source Serif 4", "Libertinus Serif", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1524; --card: #172036; --ink: #E6EAF3; --muted: #9AA5BD;
    --navy: #DCE4F7; --royal: #8EA9F2; --amber: #F2B441; --sand: #2E2614;
    --mist: #1F2A44; --line: #2A3653; --on-navy: #0F1524; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1524; --card: #172036; --ink: #E6EAF3; --muted: #9AA5BD;
  --navy: #DCE4F7; --royal: #8EA9F2; --amber: #F2B441; --sand: #2E2614;
  --mist: #1F2A44; --line: #2A3653; --on-navy: #0F1524; color-scheme: dark;
}
body { background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.6; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: grid; gap: 18px; }
header { display: flex; align-items: center; gap: 14px; }
.logo { background: #FFFFFF; border-radius: 12px; padding: 6px 10px; display: flex; border: 1px solid var(--line); }
.logo img { height: 34px; width: auto; display: block; }
.brand h1 { margin: 0; font-family: var(--sans); font-weight: 600; font-size: 1.15rem; letter-spacing: 0.06em; color: var(--navy); text-wrap: balance; }
.brand p { margin: 0; font-family: var(--sans); font-size: 0.85rem; color: var(--muted); }

.picker { display: grid; gap: 10px; }
.label { font-family: var(--sans); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
button { font-family: var(--sans); cursor: pointer; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 13px; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.qbtn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 7px 0; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
.qbtn[aria-current="true"] { background: var(--royal); color: #FFFFFF; border-color: var(--royal); }
button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

.sol { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 20px 22px; display: grid; gap: 14px; min-width: 0; }
.sol-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.eyebrow { font-family: var(--sans); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.qno { font-family: var(--sans); font-weight: 600; font-size: 1.5rem; color: var(--navy); line-height: 1.1; }
.tag { font-family: var(--sans); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em; color: var(--royal); border: 1px solid var(--royal); border-radius: 6px; padding: 2px 8px; }
.answer { margin-left: auto; background: var(--sand); border: 1px solid var(--amber); border-radius: 999px; padding: 4px 14px; font-family: var(--sans); font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
.answer b { font-size: 1.05rem; color: var(--ink); }
.answer span { font-family: var(--serif); }
.topics { font-family: var(--sans); font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.idea { background: var(--mist); border-radius: 10px; padding: 10px 14px; }
.idea strong { font-family: var(--sans); color: var(--royal); font-weight: 600; margin-right: 6px; }
.idea em { font-style: italic; }
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: s; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; }
ol.steps li::before { content: counter(s); font-family: var(--sans); font-weight: 600; font-size: 0.85rem; color: var(--royal); border: 1.5px solid var(--royal); border-radius: 50%; width: 26px; height: 26px; display: grid; place-items: center; margin-top: 1px; }
.stepbody { min-width: 0; overflow-x: auto; }
.nav { display: flex; justify-content: space-between; gap: 10px; }
.navbtn { border: 1px solid var(--line); background: var(--card); color: var(--navy); border-radius: 10px; padding: 10px 14px; font-size: 0.92rem; }
.navbtn[disabled] { opacity: 0.4; cursor: default; }
.note { font-family: var(--sans); font-size: 0.82rem; color: var(--muted); text-align: center; }
mjx-container { color: var(--ink); }
mjx-container[display="false"] { margin: 0 1px; }
@media (prefers-reduced-motion: no-preference) { .sol { transition: opacity .15s ease; } }
</style>
</head>

<script>
(function () {
  var tests = JSON.parse(document.getElementById('data').textContent);
  var N = 30;
  var cur = { t: tests[0].no, q: 1 };
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  var testRow = document.getElementById('testRow');
  var qGrid = document.getElementById('qGrid');
  var sol = document.getElementById('sol');
  function idx(t) { for (var i = 0; i < tests.length; i++) if (tests[i].no === t) return i; return -1; }
  function parseHash() {
    var m = /^#?d(\d{1,2})-s(\d{1,2})$/i.exec(location.hash || '');
    if (m && idx(+m[1]) >= 0 && +m[2] >= 1 && +m[2] <= N) return { t: +m[1], q: +m[2] };
    return null;
  }
  function typeset(el) {
    if (window.MathJax && MathJax.typesetPromise) {

  function renderPicker() {
    testRow.innerHTML = '';

      testRow.appendChild(b);
    });
    qGrid.innerHTML = '';

        b.textContent = i; b.setAttribute('aria-label', 'Soru ' + i);
        b.setAttribute('aria-current', i === cur.q ? 'true' : 'false');
        b.addEventListener('click', function () { go(cur.t, i); });
        qGrid.appendChild(b);
      })(i);
    }
  }
  function renderSol() {
    var t = tests[idx(cur.t)], q = t.qs[cur.q - 1];
    var steps = q.steps.map(function (s) { return '<li><div class="stepbody">' + esc(s) + '</div></li>'; }).join('');
    sol.innerHTML =
      '<div class="sol-head">' +
        '<div><div class="eyebrow">' + esc(t.title) + '</div><div class="qno">Soru ' + cur.q + '</div></div>' +

      '</div>' +

      '<ol class="steps">' + steps + '</ol>' +
      '<div class="topics">' + esc(q.topic) + '</div>';

    var k = idx(cur.t);
    document.getElementById('prev').disabled = (k === 0 && cur.q === 1);
    document.getElementById('next').disabled = (k === tests.length - 1 && cur.q === N);
  }
  function go(t, q) { cur = { t: t, q: q }; renderPicker(); renderSol(); }
  document.getElementById('prev').addEventListener('click', function () {
    var k = idx(cur.t);
    if (cur.q > 1) go(cur.t, cur.q - 1); else if (k > 0) go(tests[k - 1].no, N);
  });
  document.getElementById('next').addEventListener('click', function () {
    var k = idx(cur.t);
    if (cur.q < N) go(cur.t, cur.q + 1); else if (k < tests.length - 1) go(tests[k + 1].no, 1);
  });
  window.addEventListener('hashchange', function () { var h = parseHash(); if (h) go(h.t, h.q); });
  var start = parseHash() || cur;
  go(start.t, start.q);
})();
